name: Build Lock by Isril APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          test -f LockByIsril_Source.zip
          rm -rf extracted
          mkdir -p extracted
          unzip -q LockByIsril_Source.zip -d extracted

      - name: Apply v1.1 fixes
        run: python3 ci/apply-fixes-v1.1.py

      - name: Apply v1.2 fixes
        run: python3 ci/apply-fixes-v1.2.py

      - name: Apply v1.3 fixes
        run: python3 ci/apply-fixes-v1.3.py

      - name: Apply v1.4 fixes
        run: python3 ci/apply-fixes-v1.4.py

      - name: Build APK
        working-directory: extracted/LockByIsril
        run: gradle :app:assembleDebug

      - name: Package patched source
        run: |
          cd extracted
          zip -qr ../LockByIsril_Source_v1.4.zip LockByIsril

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockByIsril-v1.4-APK
          path: extracted/LockByIsril/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: LockByIsril-v1.4-Source
          path: LockByIsril_Source_v1.4.zip
